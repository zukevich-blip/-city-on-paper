<title>Направление B · Световой стол</title>
<style>
:root{--bg:#141a17;--panel:#1d2621;--ink:#e9e4d6;--muted:#9fa79b;--gold:#d2a865;--line:#2f3b34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
header b{font:600 13px ui-monospace,monospace;letter-spacing:.2em;color:var(--gold)}header span{font:12px ui-monospace,monospace;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 50px)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.table{position:relative;padding:24px;background:radial-gradient(circle at 45% 40%,#26332c,#121815 70%);overflow:hidden}
.sheet{position:relative;max-width:900px;margin:auto;box-shadow:0 0 0 1px #0008,0 30px 80px #000c}
.sheet img{display:block;width:100%;height:auto}
.loupe{position:absolute;width:210px;height:210px;border-radius:50%;left:48.7%;top:35.9%;transform:translate(-50%,-50%);border:3px solid var(--gold);box-shadow:0 0 0 6px #0006,0 12px 40px #000;overflow:hidden;background:#000}
.loupe img{position:absolute;width:1092px;left:-443px;top:-385px;max-width:none}
.cone{position:absolute;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:70px solid #d2a86566;transform-origin:50% 100%}
.coord{position:absolute;left:24px;bottom:18px;font:12px ui-monospace,monospace;color:var(--muted)}
aside{background:var(--panel);border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
aside h1{font:400 30px/1.1 Georgia,serif;margin:0}aside p{color:var(--muted);margin:0;font-size:13px}
.strip{display:flex;flex-direction:column;gap:10px}.strip figure{margin:0;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:#0f1411;border:1px solid var(--line);padding:6px}
.strip img{width:96px;height:68px;object-fit:contain;background:#000}.strip b{font:600 12px ui-monospace,monospace;color:var(--gold)}.strip small{display:block;color:var(--muted);font-size:11px}
.tag{font:11px ui-monospace,monospace;border:1px solid var(--gold);color:var(--gold);padding:2px 6px;align-self:flex-start}
</style></head><body>
