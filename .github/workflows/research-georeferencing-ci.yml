name: Research georeferencing checks

on:
  pull_request:
    paths:
      - 'tools/automated_gcp.py'
      - 'tools/integration_check.py'
      - 'tools/requirements-gcp.txt'
      - 'tests/test_geo_pipeline.py'
      - '.github/workflows/research-georeferencing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only test dependencies
        run: python -m pip install -r tools/requirements-gcp.txt
      - name: Compile, run synthetic and negative tests
        run: |
          python -m compileall -q tools/automated_gcp.py tools/integration_check.py tests/test_geo_pipeline.py
          python -m pytest -q tests/test_geo_pipeline.py
