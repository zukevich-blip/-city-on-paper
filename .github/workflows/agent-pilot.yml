name: Agent pilot | museum evidence checks
on:
  push:
    branches:
      - review/safe-agent-consilium-20261112
    paths:
      - 'tools/agents/pilot.py'
      - 'tests/test_agent_pilot.py'
      - '.github/workflows/agent-pilot.yml'
      - 'docs/agents/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-agent-readonly-pilot
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate read-only inspection engine
        run: |
          python -m py_compile tools/agents/pilot.py
          python tools/agents/pilot.py --out /tmp/agent-audit/report-offline.json
      - name: Check official source URLs without image downloads
        continue-on-error: true
        run: |
          python tools/agents/pilot.py --live-sources --out /tmp/agent-audit/report-live.json
      - name: Upload inspectable evidence
        uses: actions/upload-artifact@v4
        with:
          name: museum-agent-pilot
          path: /tmp/agent-audit
          retention-days: 14
