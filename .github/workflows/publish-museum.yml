name: Publish City on Paper public museum
run-name: Город на бумаге · единый проверенный музей

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-museum.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: city-on-paper-public-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy verified public museum to GitHub Pages
    if: github.repository == 'zukevich-blip/-city-on-paper'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned, fully tested museum preview
        uses: actions/checkout@v4
        with:
          # Explicitly published public demonstration. Original research PRs
          # stay draft; never auto-follow their new commits.
          ref: e3c888a2acd9ee8f0e4d2683d9629b2b1aef585a

      - name: Verify exact approved test run before downloading
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=43336253340
          EXPECTED_SHA=e3c888a2acd9ee8f0e4d2683d9629b2b1aef585a
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > /tmp/city-public-tested-run.json
          ACTUAL_SHA="$(python -c 'import json;print(json.load(open("/tmp/city-public-tested-run.json"))["head_sha"])')"
          CONCLUSION="$(python -c 'import json;print(json.load(open("/tmp/city-public-tested-run.json"))["conclusion"])')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$CONCLUSION" = success
          count="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="city-on-paper-vnext-preview" and .expired==false)] | length')"
          test "$count" -gt 0
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing exact tested revision $EXPECTED_SHA from CI run $RUN_ID"

      - name: Download exactly the tested museum artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          mkdir -p private-site
          gh run download "$RUN_ID" --repo "$GH_REPO" --name city-on-paper-vnext-preview --dir private-site
          test -f private-site/index.html
          test -f private-site/world/index.html
          test -f private-site/poc/compare/index.html

      - name: Build strict allowlisted public site
        run: |
          python tools/release/build_public_site.py --source private-site --out public
          test -s public/index.html
          test -s public/salon/index.html
          test -s public/world/index.html
          test -s public/atlas-prototype/index.html
          test -s public/eras/three-epochs.js
          test -s public/eras/three-epochs.css
          test -s public/eras/chronoscope.js
          test -s public/eras/chronoscope.css
          test -s public/eras/city-lab.js
          test -s public/eras/city-lab.css
          test -s public/desk/index.html
          test -s public/desk/desk.css
          test -s public/desk/desk.js
          grep -q 'deskMap' public/desk/index.html
          grep -q 'album-book' public/desk/desk.js
          grep -q 'countryIndex' public/eras/atlas.js
          grep -q 'CityOnPaperCityLab' public/eras/city-lab.js
          grep -q 'user-photo' public/eras/city-lab.js
          test -s public/eras/curatorial-desk.js
          test -s public/eras/curatorial-desk.css
          test -s public/eras/journey.js
          test -s public/eras/journey.css
          test -s public/eras/cartography.js
          test -s public/eras/data/map-evidence.json
          test -s public/assets/nav/museum-nav.js
          test -s public/assets/hybrid/engraving.css
          test -s public/cities/index.html
          test -s public/atlas/index.html
          test -s public/stories/index.html
          test -s public/stories/paris-on-paper/index.html
          test -s public/experience/index.html
          test -s public/data/coverage/world-coverage-20261110.json
          test -s public/contribute/index.html
          grep -q 'CityOnPaperChronoscope' public/eras/chronoscope.js
          grep -q 'CityOnPaperCuratorialDesk' public/eras/curatorial-desk.js
          grep -q 'upload-photo' public/eras/three-epochs.js
          grep -q 'citySearch' public/atlas-prototype/index.html
          grep -q 'localMarkers' public/atlas-prototype/index.html
          test -s public/poc/compare/homography.js
          test -s public/sitemap.xml
          test -s public/robots.txt
          test ! -e public/data/candidates
          test ! -e public/docs/consilium
          test ! -e public/PROJECT_HANDOFF.md

      - name: Verify public-site safety and metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path("public")
          manifest=json.loads((site/"PUBLIC_BUILD.json").read_text(encoding="utf-8"))
          assert manifest["public_html_pages"] >= 30
          assert not manifest["candidate_research_included"]
          files=[p for p in site.rglob("*") if p.is_file()]
          assert not any(p.suffix in {".env", ".pem", ".p12", ".key", ".sqlite", ".db"} for p in files)
          assert not any("secrets" in p.parts or "consilium" in p.parts for p in files)
          assert "sitemap.xml" in {p.name for p in files}
          assert "index,follow" in (site/"index.html").read_text(encoding="utf-8")
          assert "Allow: /" in (site/"robots.txt").read_text(encoding="utf-8")
          print(f"PUBLIC SAFETY PASS: {len(files)} allowlisted site files, {manifest['public_html_pages']} pages")
          PY

      - name: Record audited public demo provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("public/PUBLIC_DEMO_REVISION.json")
          path.write_text(json.dumps({
            "kind": "public demonstration / research preview",
            "source_revision": "e3c888a2acd9ee8f0e4d2683d9629b2b1aef585a",
            "qa_run": 43336253340,
            "qa_conclusion": "success",
            "publication": "museum-safe allowlist",
            "scientific_acceptance": "research_draft_unverified"
          }, ensure_ascii=False, indent=2)+"\\n", encoding="utf-8")
          PY

      - name: Audit internal links and files of the published version
        run: |
          python tools/release/audit_public_links.py --root public --report public/LINK_AUDIT.json --strict
          test -s public/LINK_AUDIT.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload vetted Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
