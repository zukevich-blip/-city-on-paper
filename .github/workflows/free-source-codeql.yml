name: Museum Source | Free CodeQL security review
run-name: Город на бумаге · анализ уязвимостей JavaScript и Python

on:
  push:
    branches:
      - feature/viewpoint-evidence-atlas-20261113
    paths:
      - 'eras/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/free-source-codeql.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: city-paper-free-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-security:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize free security-and-quality analysis
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Scan and publish findings in GitHub Security
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
